# настройки подключения к PostgreSQL, стандарт Jakarta
jakarta.persistence.jdbc.url=jdbc:postgresql://localhost:5432/user_service_db
jakarta.persistence.jdbc.user=hibernate_user
jakarta.persistence.jdbc.password=12345
jakarta.persistence.jdbc.driver=org.postgresql.Driver

# диалект Postgres
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# логирование включая цветную подсветку
hibernate.show_sql=true
hibernate.format_sql=true
hibernate.highlight_sql=true

# разрешаем фреймворку обновлять таблицы
hibernate.hbm2ddl.auto=update